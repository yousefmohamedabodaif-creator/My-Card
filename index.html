<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أحمد أبو ضيف | Egymind</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f5f7ff;--mut:#a9b2d8;--a:#38bdf8;--b:#2563eb;--c:#1d4ed8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,sans-serif;display:flex;justify-content:center;align-items:center;padding:64px 16px 22px;overflow-x:hidden}
.au{position:fixed;inset:0;z-index:-1;overflow:hidden}
.au i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:fl 9s ease-in-out infinite alternate}
.au i:nth-child(1){width:340px;height:340px;background:var(--c);top:-80px;right:-60px}
.au i:nth-child(2){width:320px;height:320px;background:var(--a);bottom:-90px;left:-70px;animation-delay:-3s;opacity:.4}
.au i:nth-child(3){width:240px;height:240px;background:var(--b);top:42%;left:30%;animation-delay:-6s;opacity:.3}
@keyframes fl{to{transform:translate(50px,70px) scale(1.25)}}
.card{width:100%;max-width:400px;text-align:center;padding:30px 20px 22px;border-radius:34px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 30px 80px rgba(0,0,0,.5)}
.ph{width:140px;height:140px;margin:0 auto 16px;border-radius:50%;padding:4px;position:relative}
.ph::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--a),var(--c),var(--b),var(--a));animation:rot 5s linear infinite;filter:blur(1px)}
.ph span{position:absolute;inset:3px;border-radius:50%;background:#222a4d center top/cover;border:3px solid #0d1230}
@keyframes rot{to{transform:rotate(360deg)}}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.6px;direction:ltr}
.t{margin:4px 0 0;font-weight:600;font-size:16px;background:linear-gradient(90deg,var(--a),#8ab4ff);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.c{color:var(--mut);font-size:14px;direction:ltr}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0 14px}
.g a,.vid{position:relative;overflow:hidden;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;border-radius:22px;border:1px solid rgba(255,255,255,.3);background-color:rgba(255,255,255,.07);background-image:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.03) 50%,rgba(255,255,255,.1));backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -12px 22px rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.45);transition:transform .15s}
.g a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 6px 14px}
.g a:active,.vid:active{transform:scale(.95)}
.g a::before,.vid::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));border-radius:22px 22px 50% 50%/22px 22px 18px 18px;pointer-events:none}
.g a::after,.vid::after{content:"";position:absolute;top:-30%;bottom:-30%;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sh 4.2s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none}
@keyframes sh{0%,55%{left:-60%}100%{left:140%}}
svg.i{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.vid{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;padding:15px;font:700 17px "Readex Pro",Tahoma,sans-serif;cursor:pointer;--t:#ff4d7d}
.vid svg.i{width:22px;height:22px;fill:#fff}
.em{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;color:var(--mut)}
.em a{display:block;margin-top:4px;color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;direction:ltr;word-break:break-all}
/* video */
#ov{position:fixed;inset:0;z-index:9;display:none;background:#000;overflow:hidden;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#ov.on{display:flex}
.vb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;animation:fl 4s ease-in-out infinite alternate}
.v1{width:300px;height:300px;background:var(--c);top:-70px;left:-70px}
.v2{width:320px;height:320px;background:var(--a);bottom:-90px;right:-80px;animation-delay:-1.5s}
.v3{width:220px;height:220px;background:var(--b);top:40%;right:-60px;animation-delay:-3s;opacity:.5}
.gr{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 75%)}
#ovph{position:relative;width:170px;height:170px;border-radius:50%;background:#222a4d center top/cover;border:4px solid #fff;box-shadow:0 0 60px var(--a);transform:scale(0);margin-bottom:26px;transition:width .8s cubic-bezier(.2,1,.3,1),height .8s cubic-bezier(.2,1,.3,1),margin .8s}
#ovph.s{transform:scale(1);transition:transform .8s cubic-bezier(.2,1.7,.4,1),width .8s,height .8s,margin .8s}
#ovph.sm{width:96px;height:96px;margin-bottom:14px}
#ovph::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--a);animation:rg 1.6s ease-out infinite}
@keyframes rg{to{transform:scale(1.9);opacity:0}}
#st{position:relative;min-height:150px}
.sc{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;max-width:360px}
.w{font-size:clamp(34px,10vw,54px);font-weight:700;line-height:1.3;opacity:0;animation:wd .7s cubic-bezier(.2,1.2,.3,1) forwards}
.big .w{font-size:clamp(46px,14vw,76px)}
.w.h{background:linear-gradient(90deg,var(--a),#8ab4ff,var(--b));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wd .7s cubic-bezier(.2,1.2,.3,1) forwards,gs 2s linear infinite}
@keyframes wd{from{opacity:0;transform:translateY(50px) rotate(5deg) scale(.7);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes gs{to{background-position:200%}}
@keyframes out{to{opacity:0;transform:translateY(-30px) scale(.95);filter:blur(10px)}}
.num{width:100%;margin-top:14px;font-size:28px;font-weight:700;direction:ltr;letter-spacing:2px;opacity:0;animation:wd .7s .5s forwards}
.cb{display:inline-flex;margin-top:14px;width:64px;height:64px;border-radius:50%;align-items:center;justify-content:center;background:var(--a);box-shadow:0 0 0 0 var(--a);animation:wd .6s .7s forwards,pu 1.2s 1.3s infinite;opacity:0}
.cb svg{width:28px;height:28px;stroke:#04122a}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(56,189,248,.7)}100%{box-shadow:0 0 0 30px rgba(56,189,248,0)}}
.ch{position:absolute;bottom:-60px;font-size:26px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg)}}
#pg{position:absolute;bottom:0;right:0;height:4px;width:0;background:linear-gradient(90deg,var(--b),var(--a))}
#sk{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:3;color:#fff;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:20px;padding:8px 16px;font:600 13px "Readex Pro",Tahoma,sans-serif;cursor:pointer}
.lg{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:5;display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;color:var(--ink);cursor:pointer;overflow:hidden;font:700 13px "Readex Pro",Tahoma,sans-serif;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.05));backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 20px rgba(0,0,0,.45)}
.lg b{opacity:.45;font-weight:700;position:relative}.lg i{opacity:.3;font-style:normal;position:relative}
html[lang=en] .lg .e,html[lang=ar] .lg .r{opacity:1;color:var(--a)}
.lg::after{content:"";position:absolute;top:-30%;bottom:-30%;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sh 4.2s ease-in-out infinite;pointer-events:none}
</style>
</head>

 const wh=t=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(250,t);o.frequency.exponentialRampToValueAtTime(1800,t+.35);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.12,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(out);o.start(t);o.stop(t+.45)};
 const sc=[0,4,7,9,12,9,7,4],bs=[0,-3,-5,-7],base=261.63,st=.25;
 out.gain.setValueAtTime(.55,t0);out.gain.setValueAtTime(.55,t0+D-1.4);out.gain.linearRampToValueAtTime(0,t0+D);
 for(let i=0;i<D/st;i++){const t=t0+i*st;
  tone(base*2**(sc[i%8]/12),t,.2,"triangle",.2);
  if(i%2===0)kick(t);
  if(i%4===2)tone(7000,t,.04,"square",.035);
  if(i%4===3)tone(base*4*2**(sc[(i+3)%8]/12),t,.1,"sine",.07);
  if(i%8===0)tone(base/2*2**(bs[(i/8|0)%4]/12),t,1.7,"sawtooth",.12);}
 S.forEach(s=>wh(t0+s[0]-.1>t0?t0+s[0]-.1:t0));
}
function stop(){tm.forEach(clearTimeout);tm=[];if(ac){try{ac.close()}catch(e){}ac=null}$("ov").classList.remove("on");$("ovph").className="";$("st").innerHTML="";$("chs").innerHTML="";$("pg").style.transition="none";$("pg").style.width="0"}
function play(){
 stop();$("ov").classList.add("on");
 try{music()}catch(e){}
 const E=["💻","⚙️","🛡️","📱","🖥️","☁️","🔧","🌐","🔒","⚡"];
 $("chs").innerHTML=E.map((e,i)=>`<div class="ch" style="left:${(i*37+8)%88}%;animation-duration:${6+i%4*2}s;animation-delay:${-i*1.1}s">${e}</div>`).join("");
 void $("pg").offsetWidth;$("pg").style.transition="width "+D+"s linear";$("pg").style.width="100%";
 tm.push(setTimeout(()=>$("ovph").classList.add("s"),150));
 tm.push(setTimeout(()=>$("ovph").classList.add("sm"),2700));
 S.forEach(([t,d,cl,ws,ex],k)=>tm.push(setTimeout(()=>{
  const last=k===S.length-1;
  $("st").innerHTML=`<div class="sc ${cl}" style="${last?"":"animation:out .45s ease-in forwards "+(d-.45)+"s"}">`+ws.map(([x,h],i)=>`<span class="w${h?" h":""}" style="animation-delay:${i*.18}s">${x}</span>`).join("")+(ex||"")+"</div>";
 },t*1000)));
 tm.push(setTimeout(stop,D*1000));
}
function setL(l){const h=document.documentElement;h.lang=l;h.dir=l=="ar"?"rtl":"ltr";S=l=="ar"?SA:SE;document.querySelectorAll("[data-ar]").forEach(e=>e.textContent=e.dataset[l]);document.title=l=="ar"?"أحمد أبو ضيف | Egymind":"Ahmed Abu Deif | Egymind"}
$("lg").onclick=()=>{stop();setL(document.documentElement.lang=="ar"?"en":"ar")};
$("pl").onclick=play;$("sk").onclick=stop;
</script>
